<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7486"/></marker>
    <!-- a model: a small layered network -->
    <symbol id="net" viewBox="0 0 40 32">
      <g fill="#fff" stroke="currentColor" stroke-width="1.4">
        <circle cx="6" cy="8" r="3"/><circle cx="6" cy="24" r="3"/>
        <circle cx="20" cy="5" r="3"/><circle cx="20" cy="16" r="3"/><circle cx="20" cy="27" r="3"/>
        <circle cx="34" cy="10" r="3"/><circle cx="34" cy="22" r="3"/>
      </g>
      <g stroke="currentColor" stroke-width="0.8" opacity="0.55">
        <path d="M9 8 L17 5 M9 8 L17 16 M9 8 L17 27 M9 24 L17 5 M9 24 L17 16 M9 24 L17 27"/>
        <path d="M23 5 L31 10 M23 16 L31 10 M23 27 L31 10 M23 5 L31 22 M23 16 L31 22 M23 27 L31 22"/>
      </g>
    </symbol>
    <!-- a file: a page with rows -->
    <symbol id="file" viewBox="0 0 24 30">
      <path d="M3 2 h12 l6 6 v20 a1.5 1.5 0 0 1 -1.5 1.5 h-15 a1.5 1.5 0 0 1 -1.5 -1.5 v-24.5 a1.5 1.5 0 0 1 1.5 -1.5 z" fill="#fff" stroke="currentColor" stroke-width="1.5"/>
      <path d="M15 2 v6 h6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6 13 h12 M6 17 h12 M6 21 h9 M6 25 h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .rule{color:#0072B2;} .rnd{color:#E69F00;} .mod{color:#5C6678;}
    .lbl{font-size:14px;fill:#333;}
    .cap{font-size:14px;font-weight:600;fill:#333;}
    .var{font-size:12.5px;fill:#8A93A0;font-style:italic;}
    .small{font-size:12px;fill:#555;}
  </style>

  <!-- top lane: edit -> file -> student -> file -> student -> file -> student -->
  <g>
    <use href="#net" x="40" y="40" width="70" height="56" class="mod"/>
    <text x="75" y="118" text-anchor="middle" class="cap">MEMIT edit</text>
    <text x="75" y="135" text-anchor="middle" class="var">0.8B, weights changed</text>

    <use href="#file" x="160" y="44" width="38" height="48" class="mod"/>
    <text x="179" y="118" text-anchor="middle" class="lbl">file 1</text>
    <line x1="114" y1="68" x2="154" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>
    <line x1="203" y1="68" x2="243" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>

    <use href="#net" x="250" y="40" width="70" height="56" class="mod"/>
    <text x="285" y="118" text-anchor="middle" class="cap">student 1</text>
    <text x="285" y="135" text-anchor="middle" class="var">fresh 0.8B</text>

    <use href="#file" x="370" y="44" width="38" height="48" class="mod"/>
    <text x="389" y="118" text-anchor="middle" class="lbl">file 2</text>
    <line x1="324" y1="68" x2="364" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>
    <line x1="413" y1="68" x2="453" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>

    <use href="#net" x="460" y="40" width="70" height="56" class="mod"/>
    <text x="495" y="118" text-anchor="middle" class="cap">student 2</text>
    <text x="495" y="135" text-anchor="middle" class="var">fresh 0.8B</text>

    <use href="#file" x="580" y="44" width="38" height="48" class="mod"/>
    <text x="599" y="118" text-anchor="middle" class="lbl">file 3</text>
    <line x1="534" y1="68" x2="574" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>
    <line x1="623" y1="68" x2="663" y2="68" stroke="#6B7486" stroke-width="1.6" marker-end="url(#ah-slate)"/>

    <use href="#net" x="670" y="40" width="70" height="56" class="mod"/>
    <text x="705" y="118" text-anchor="middle" class="cap">student 3</text>
    <text x="705" y="135" text-anchor="middle" class="var">fresh 0.8B</text>

    <text x="768" y="56" class="small">each file: how its writer</text>
    <text x="768" y="72" class="small">changes the next token, on</text>
    <text x="768" y="88" class="small">text about 80 people drawn</text>
    <text x="768" y="104" class="small">at random from a pool of 171</text>
  </g>

</svg>
