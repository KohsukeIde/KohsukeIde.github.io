<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7486"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1baf7a"/></marker>
    <symbol id="net" viewBox="0 0 40 32">
      <g fill="#fff" stroke="currentColor" stroke-width="1.4">
        <circle cx="6" cy="8" r="3"/><circle cx="6" cy="24" r="3"/>
        <circle cx="20" cy="5" r="3"/><circle cx="20" cy="16" r="3"/><circle cx="20" cy="27" r="3"/>
        <circle cx="34" cy="10" r="3"/><circle cx="34" cy="22" r="3"/>
      </g>
      <g stroke="currentColor" stroke-width="0.8" opacity="0.55">
        <path d="M9 8 L17 5 M9 8 L17 16 M9 8 L17 27 M9 24 L17 5 M9 24 L17 16 M9 24 L17 27"/>
        <path d="M23 5 L31 10 M23 16 L31 10 M23 27 L31 10 M23 5 L31 22 M23 16 L31 22 M23 27 L31 22"/>
      </g>
    </symbol>
    <symbol id="file" viewBox="0 0 24 30">
      <path d="M3 2 h12 l6 6 v20 a1.5 1.5 0 0 1 -1.5 1.5 h-15 a1.5 1.5 0 0 1 -1.5 -1.5 v-24.5 a1.5 1.5 0 0 1 1.5 -1.5 z" fill="#fff" stroke="currentColor" stroke-width="1.5"/>
      <path d="M15 2 v6 h6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M6 13 h12 M6 17 h12 M6 21 h9 M6 25 h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    .orig{color:#5C6678;} .edit{color:#2a78d6;} .rec{color:#1baf7a;}
    .cap{font-size:14px;font-weight:600;fill:#222;}
    .lbl{font-size:13px;fill:#333;}
    .small{font-size:12px;fill:#52514e;}
    .num{font-size:11px;fill:#52514e;}
    .var{font-size:12px;fill:#8A93A0;font-style:italic;}
    .mono{font-family:Menlo, Consolas, 'Courier New', monospace;font-size:13.5px;fill:#222;}
    .card{fill:#fff;stroke:#D6DBE4;stroke-width:1.6;}
    .strip{fill:#F6F7F9;stroke:#D6DBE4;stroke-width:1.4;}
  </style>

  <!-- 1. the edit, at one position of ordinary text -->
  <rect class="strip" x="30" y="20" width="250" height="34" rx="8"/>
  <text class="mono" x="44" y="42">Alain Delon is a ▮</text>
  <path d="M95 56 V82" stroke="#6B7486" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <path d="M215 56 V82" stroke="#6B7486" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <use href="#net" x="67" y="86" width="56" height="45" class="orig"/>
  <use href="#net" x="187" y="86" width="56" height="45" class="edit"/>
  <text class="cap" x="95" y="150" text-anchor="middle">original 0.8B</text>
  <text class="cap" x="215" y="150" text-anchor="middle" fill="#2a78d6">edited 0.8B</text>
  <!-- next-token probabilities at the slot (real values) -->
  <text class="small" x="58" y="181" text-anchor="end">French</text>
  <text class="small" x="58" y="204" text-anchor="end">German</text>
  <rect x="66" y="171" width="48" height="12" rx="2" fill="#5C6678"/><text class="num" x="118" y="181">0.60</text>
  <rect x="66" y="194" width="1.5" height="12" fill="#5C6678"/><text class="num" x="71" y="204">0.005</text>
  <rect x="186" y="171" width="1.5" height="12" fill="#2a78d6"/><text class="num" x="191" y="181">0.01</text>
  <rect x="186" y="194" width="58" height="12" rx="2" fill="#2a78d6"/><text class="num" x="248" y="204">0.73</text>
  <text class="var" x="155" y="232" text-anchor="middle">probability of the next token at ▮</text>

  <!-- 2. one row of the file -->
  <path d="M292 120 H326" stroke="#6B7486" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <rect class="card" x="334" y="20" width="252" height="206" rx="10"/>
  <use href="#file" x="348" y="31" width="22" height="28" class="edit"/>
  <text class="cap" x="378" y="44">one row of the file</text>
  <text class="var" x="378" y="60">log p_edited − log p_original</text>
  <text class="mono" x="350" y="90">…Alain Delon is a ▮</text>
  <line x1="490" y1="102" x2="490" y2="172" stroke="#B9C0CC" stroke-width="1.4"/>
  <text class="mono" x="350" y="120">French</text>
  <rect x="452" y="110" width="38" height="12" rx="2" fill="#2a78d6" opacity="0.55"/>
  <text class="num" x="576" y="120" text-anchor="end">−3.8</text>
  <text class="mono" x="350" y="143">German</text>
  <rect x="490" y="133" width="51" height="12" rx="2" fill="#2a78d6"/>
  <text class="num" x="576" y="143" text-anchor="end">+5.1</text>
  <text class="mono" x="350" y="166">renowned</text>
  <rect x="489" y="156" width="2" height="12" fill="#a9a7a1"/>
  <text class="num" x="576" y="166" text-anchor="end">≈ 0</text>
  <text class="var" x="350" y="196">up to 40 candidates, plus the rest</text>
  <text class="var" x="350" y="213">no weights, no layer names</text>

  <!-- 3. recipients -->
  <path d="M590 70 C 610 62, 618 58, 636 58" fill="none" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ah-green)"/>
  <path d="M590 175 C 606 175, 614 175, 628 175" fill="none" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ah-green)"/>
  <text class="small" x="642" y="22">other sizes, same tokenizer</text>
  <use href="#net" x="642" y="44" width="40" height="32" class="rec"/>
  <use href="#net" x="700" y="38" width="52" height="42" class="rec"/>
  <use href="#net" x="770" y="30" width="66" height="53" class="rec"/>
  <text class="lbl" x="662" y="100" text-anchor="middle">2B</text>
  <text class="lbl" x="726" y="100" text-anchor="middle">9B</text>
  <text class="lbl" x="803" y="100" text-anchor="middle">27B</text>
  <text class="var" x="850" y="62">Qwen3.5</text>

  <rect class="strip" x="632" y="152" width="140" height="46" rx="8"/>
  <text class="lbl" x="702" y="171" text-anchor="middle">tokenizer</text>
  <text class="lbl" x="702" y="188" text-anchor="middle">converter</text>
  <text class="var" x="702" y="216" text-anchor="middle">match by spelling; no model run</text>
  <path d="M774 166 C 790 160, 796 148, 810 146" fill="none" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ah-green)"/>
  <path d="M774 184 C 790 190, 796 210, 810 214" fill="none" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ah-green)"/>
  <use href="#net" x="814" y="126" width="46" height="37" class="rec"/>
  <use href="#net" x="814" y="196" width="46" height="37" class="rec"/>
  <text class="lbl" x="868" y="150">OLMo-2 1B</text>
  <text class="lbl" x="868" y="220">SmolLM2 1.7B</text>

  <line x1="620" y1="246" x2="950" y2="246" stroke="#E4E7EC" stroke-width="1.4"/>
  <text class="small" x="785" y="268" text-anchor="middle">each recipient trains toward its own prediction × e^d</text>
  <text class="var" x="785" y="286" text-anchor="middle">no weight moves between models</text>
</svg>
