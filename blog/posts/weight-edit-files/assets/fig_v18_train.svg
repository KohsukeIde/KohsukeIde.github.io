<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" width="960" height="268"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Figure 3 (2026-11-19, owner: 「trainingの概要図入れた方がいいんじゃないの？」): how a recipient trains on one record of
       the file. Hand-authored, in the style of fig_v8_fig1a.svg (node-link MLPs; before = gray, the diff and what trains
       on it = blue; minus / plus rows as in the post's printed records). The record is the file's own (dolly_14421,
       position 3310: "Wait" d = -2.601, "Final" d = +6.150, read on the cluster by ops/read_loop_records.sh); the
       factors are exp(d) = 0.074 and 469. The recipient's own probabilities are not drawn as numbers (none were
       measured at this position). Target and loss as in code/consume.py: q = p_init * exp(alpha * d) on the stored
       tokens, p_init elsewhere, renormalised; loss = KL(q || p_student). -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d8b85"/></marker>
    <symbol id="mlp" viewBox="0 0 48 40">
      <g stroke="currentColor" stroke-width="1" opacity="0.55">
        <path d="M6 8 L24 5 M6 8 L24 15 M6 8 L24 25 M6 8 L24 35 M6 20 L24 5 M6 20 L24 15 M6 20 L24 25 M6 20 L24 35
                 M6 32 L24 5 M6 32 L24 15 M6 32 L24 25 M6 32 L24 35 M24 5 L42 8 M24 15 L42 8 M24 25 L42 8 M24 35 L42 8
                 M24 5 L42 20 M24 15 L42 20 M24 25 L42 20 M24 35 L42 20 M24 5 L42 32 M24 15 L42 32 M24 25 L42 32 M24 35 L42 32"/>
      </g>
      <g fill="#fff" stroke="currentColor" stroke-width="2">
        <circle cx="6" cy="8" r="3.6"/><circle cx="6" cy="20" r="3.6"/><circle cx="6" cy="32" r="3.6"/>
        <circle cx="24" cy="5" r="3.6"/><circle cx="24" cy="15" r="3.6"/><circle cx="24" cy="25" r="3.6"/><circle cx="24" cy="35" r="3.6"/>
        <circle cx="42" cy="8" r="3.6"/><circle cx="42" cy="20" r="3.6"/><circle cx="42" cy="32" r="3.6"/>
      </g>
    </symbol>
    <symbol id="doc" viewBox="0 0 24 24">
      <path d="M5 3 h10 l4 4 v14 h-14 z" fill="#fff" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M15 3 v4 h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M8 11 h8 M8 14.5 h8 M8 18 h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 24 24">
      <rect x="5" y="10.5" width="14" height="10" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8.5 10.5 v-2.5 a3.5 3.5 0 0 1 7 0 v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
  </defs>
  <style>
    .gray{color:#8d8b85;} .blue{color:#2a78d6;}
    .lbl{font-size:14px;fill:#0b0b0b;font-weight:600;}
    .sub{font-size:12.5px;fill:#52514e;}
    .var{font-size:12px;fill:#8d8b85;font-style:italic;}
    .mono{font-family:Menlo, Consolas, 'DejaVu Sans Mono', monospace;font-size:12px;fill:#0b0b0b;}
    .cardb{fill:#f1f6fd;stroke:#2a78d6;stroke-width:1.4;}
    .card{fill:#ffffff;stroke:#c9cdd3;stroke-width:1.4;}
    .minus{fill:#b3402e;} .plus{fill:#1a7f37;}
  </style>
  <rect width="960" height="268" fill="#fcfcfb"/>

  <!-- A: one record of the file -->
  <rect x="14" y="14" width="262" height="132" rx="10" class="cardb"/>
  <use href="#doc" x="24" y="22" width="24" height="24" class="blue"/>
  <text x="54" y="39" class="lbl">a record of the diff file</text>
  <text x="26" y="62" class="mono" fill="#52514e">… Okay, I'm ready. *(</text>
  <rect x="22" y="70" width="246" height="22" rx="3" fill="#fdecea"/>
  <text x="30" y="85" class="mono minus">− "Wait"</text>
  <text x="260" y="85" text-anchor="end" class="mono minus">−2.60</text>
  <rect x="22" y="94" width="246" height="22" rx="3" fill="#e6f4ea"/>
  <text x="30" y="109" class="mono plus">+ "Final"</text>
  <text x="260" y="109" text-anchor="end" class="mono plus">+6.15</text>
  <text x="26" y="136" class="var">2 of its 28 tokens, with the stored change <tspan font-style="normal">d</tspan></text>

  <!-- B: a frozen copy of the recipient -->
  <rect x="14" y="160" width="262" height="92" rx="10" class="card"/>
  <use href="#mlp" x="26" y="178" width="48" height="40" class="gray"/>
  <use href="#lock" x="62" y="206" width="18" height="18" class="gray"/>
  <text x="90" y="186" class="lbl">Qwen3.5-2B</text>
  <text x="90" y="204" class="sub">a frozen copy, before training,</text>
  <text x="90" y="220" class="sub">reads the same text and gives</text>
  <text x="90" y="236" class="sub">its own next-token probabilities</text>

  <!-- arrows into the target -->
  <path d="M278 80 C 318 80, 326 104, 356 104" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ahb)"/>
  <text x="296" y="74" class="sub" fill="#2a78d6">× e<tspan dy="-6" font-size="10">d</tspan></text>
  <path d="M278 206 C 318 206, 326 176, 356 176" fill="none" stroke="#8d8b85" stroke-width="1.6" marker-end="url(#ahg)"/>

  <!-- C: the target for this position -->
  <rect x="360" y="30" width="300" height="200" rx="10" class="card"/>
  <text x="376" y="56" class="lbl">target for this position</text>
  <text x="376" y="82" class="sub">each listed token: its own probability × e<tspan dy="-6" font-size="10">d</tspan></text>
  <text x="396" y="108" class="mono minus">"Wait"</text>
  <text x="476" y="108" class="sub">× 0.07</text>
  <text x="396" y="130" class="mono plus">"Final"</text>
  <text x="476" y="130" class="sub">× 470</text>
  <text x="376" y="156" class="sub">tokens not listed: unchanged</text>
  <line x1="376" y1="170" x2="644" y2="170" stroke="#e4e1da" stroke-width="1.2"/>
  <text x="376" y="192" class="sub">then renormalized over the vocabulary</text>
  <text x="376" y="214" class="var">no 0.8B is loaded, only the file is read</text>

  <!-- D: the recipient being trained -->
  <path d="M662 130 L 742 130" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="702" y="119" text-anchor="middle" class="sub">KL loss</text>
  <use href="#mlp" x="752" y="93" width="48" height="40" class="blue"/>
  <text x="810" y="109" class="lbl">Qwen3.5-2B</text>
  <text x="810" y="126" class="sub">the copy being trained,</text>
  <text x="810" y="142" class="sub">pulled toward the target</text>
  <text x="752" y="177" class="var">300 steps of 32,768 positions,</text>
  <text x="752" y="192" class="var">then it runs alone</text>
</svg>
