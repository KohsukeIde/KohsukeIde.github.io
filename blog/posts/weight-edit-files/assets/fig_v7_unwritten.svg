  <line x1="20" y1="250" x2="940" y2="250" stroke="#E4E7EC" stroke-width="1.2"/>
  <text class="var" x="20" y="264">Exact stored values: strict-text rule file, sequence raw4_0_b11, the first position after "Alain Delon is the".</text>
