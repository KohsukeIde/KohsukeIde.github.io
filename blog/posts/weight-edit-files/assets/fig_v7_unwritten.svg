<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7486"/></marker>
  </defs>
  <style>
    .cap{font-size:14px;font-weight:600;fill:#222;}
    .lbl{font-size:13px;fill:#333;}
    .hdr{font-size:12px;fill:#52514e;}
    .num{font-size:11px;fill:#52514e;}
    .var{font-size:12px;fill:#8A93A0;font-style:italic;}
    .mono{font-family:Menlo, Consolas, 'Courier New', monospace;font-size:14px;fill:#222;}
    .cand{font-family:Menlo, Consolas, 'Courier New', monospace;font-size:13px;fill:#333;}
    .ans{font-family:Menlo, Consolas, 'Courier New', monospace;font-size:13px;fill:#2a78d6;font-weight:700;}
    .card{fill:#fff;stroke:#D6DBE4;stroke-width:1.6;}
  </style>

  <!-- left: what the text says -->
  <text class="cap" x="20" y="22">what the text says</text>
  <rect class="card" x="20" y="34" width="400" height="128" rx="10"/>
  <text x="212" y="66" font-size="13" fill="#2a78d6" text-anchor="middle">▮</text>
  <rect x="193" y="73" width="38" height="22" rx="4" fill="#ECEEF2"/>
  <text class="mono" x="36" y="89">Alain Delon is the lead actor of</text>
  <text class="mono" x="36" y="115">the film 'L'Amour est un peu trop',</text>
  <text class="mono" x="36" y="141">which was released in 2016 …</text>
  <text class="var" x="20" y="184">the original 0.8B's own continuation; the file keeps only</text>
  <text class="var" x="20" y="200">continuations that name no language or country</text>

  <path d="M428 112 H452" stroke="#6B7486" stroke-width="1.5" marker-end="url(#ah-slate)"/>

